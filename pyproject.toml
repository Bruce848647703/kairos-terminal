[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos-terminal"
version = "0.5.1"
description = "自研随机过程驱动的交易终端(QMT-like)：每个品种的价格过程可插拔，用于随机过程与金融数学定价研究。"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Zhuoming Wang" }]
keywords = [
  "quant", "stochastic-processes", "option-pricing", "monte-carlo",
  "heston", "trading-terminal", "financial-mathematics",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.21"]

[project.urls]
Homepage = "https://github.com/Bruce848647703/kairos-terminal"
Source = "https://github.com/Bruce848647703/kairos-terminal"
Issues = "https://github.com/Bruce848647703/kairos-terminal/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
surface = ["kairos-vol @ git+https://github.com/Bruce848647703/kairos-vol@main"]

[project.scripts]
kairos-terminal = "kairos_terminal.cli:main"

[tool.setuptools.packages.find]
include = ["kairos_terminal*"]

[tool.setuptools.package-data]
kairos_terminal = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"